name: Bug report
description: Report reproducible incorrect behavior in pi-sprites
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve pi-sprites. Remove all access tokens, private repository URLs, and customer data. Report security issues privately according to SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe sequence of commands and configuration that reproduces the problem.
      placeholder: |
        1. Run /sprite-use ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: pi_sprites_version
    attributes:
      label: pi-sprites version or commit
    validations:
      required: true
  - type: input
    id: pi_version
    attributes:
      label: Pi version
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
      placeholder: Output of node --version
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste sanitized text, not screenshots. Remove tokens, secrets, private URLs, and customer data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed tokens, secrets, and private data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
